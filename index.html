<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      font-size: 60px;
      margin: 0;
      animation: fadeIn 2s ease forwards;
    }

    p {
      font-size: 20px;
      margin-top: 15px;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
      animation-delay: 1s;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: #2c5364;
      transition: 0.3s;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
      animation-delay: 2s;
    }

    .btn:hover {
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      to {opacity: 1;}
    }
  </style>
</head>
<body>

  <div>
    <h1>Nexora</h1>
    <p>Your AI-powered smart learning assistant</p>
    <button class="btn">Start Exploring</button>
  </div>

</body>
</html>
